name: Build Garnet BTF Kernel
on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Сборка ядра через Action
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/crdroidandroid/android_xiaomi_kernel_garnet
          kernel-branch: 14.0
          config: garnet_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 13
          aosp-clang-version: r450784d
          disable-lto: true
          anykernel3: true
          extra-cmd: |
            echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/garnet_defconfig
