name: Extract Kernel Offsets

on:
  workflow_dispatch:

jobs:
  build-and-extract:
    runs-on: ubuntu-22.04

    steps:
      - name: Установка инструментов и pahole
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves libelf-dev bc bison flex libssl-dev clang lld llvm make git

      - name: Скачивание исходников ядра Xiaomi
        run: |
          git clone --depth=1 -b garnet-t-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Настройка конфига и обход ошибок Xiaomi
        run: |
          cd kernel
          mkdir -p drivers/misc/hwid
          touch drivers/misc/hwid/Kconfig
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*garnet*" -o -name "*sm7435*" | head -n 1)
          if [ -n "$DEFCONFIG_FILE" ]; then
            CONFIG_NAME=$(echo "$DEFCONFIG_FILE" | sed 's|arch/arm64/configs/||')
            make ARCH=arm64 $CONFIG_NAME
          else
            make ARCH=arm64 defconfig
          fi
          scripts/config --file .config --enable CONFIG_DEBUG_INFO
          scripts/config --file .config --enable CONFIG_DEBUG_INFO_DWARF4
          scripts/config --file .config --enable CONFIG_DEBUG_INFO_BTF
          make ARCH=arm64 olddefconfig

      - name: Сборка базового vmlinux
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld vmlinux || true

      - name: Извлечение смещений
        run: |
          cd kernel
          echo "=== RT_MUTEX_WAITER ==="
          pahole -C rt_mutex_waiter vmlinux || echo "Нет структуры"
          echo "=== TASK_STRUCT CRED ==="
          pahole -C task_struct vmlinux | grep -E "cred|real_cred" || echo "Нет поля"
          echo "=== CRED ==="
          pahole -C cred vmlinux || echo "Нет структуры"
