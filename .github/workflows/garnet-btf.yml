name: Build Garnet BTF Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Установка инструментов сборки
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache flex libelf-dev libssl-dev libncurses-dev git crossbuild-essential-arm64 wget

      - name: Скачивание Google Clang
        run: |
          mkdir clang
          cd clang
          # Испольуем wget с официальным статическим архивом сборщика ядер Android
          wget -q --show-progress "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz"
          tar -xzf clang-r450784d.tar.gz
          rm -f clang-r450784d.tar.gz

      - name: Скачивание исходников ядра
        run: |
          git clone --depth=1 -b 14.0 https://github.com kernel-source

      - name: Настройка конфигурации и включение BTF
        run: |
          cd kernel-source
          echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/garnet_defconfig
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang garnet_defconfig

      - name: Компиляция файла vmlinux
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang vmlinux

      - name: Загрузка готового vmlinux в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garnet-vmlinux-btf
          path: kernel-source/out/vmlinux
