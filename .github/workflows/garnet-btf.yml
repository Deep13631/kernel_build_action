name: Extract Kernel Offsets

on:
  workflow_dispatch:

jobs:
  build-and-extract:
    runs-on: ubuntu-22.04

    steps:
      - name: Установка инструментов и pahole
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves libelf-dev bc bison flex libssl-dev clang lld llvm make git gcc-aarch64-linux-gnu

      - name: Скачивание исходников ядра Xiaomi
        run: |
          git clone --depth=1 -b garnet-t-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Настройка конфига и вырезание битых модулей Xiaomi
        run: |
          cd kernel

          # Удаляем проблемные драйверы из Makefile и Kconfig
          sed -i '/hwid/d' drivers/misc/Makefile || true
          sed -i '/plaid/d' drivers/misc/Makefile || true
          sed -i '/gpio-testing-mode/d' drivers/misc/Makefile || true
          sed -i '/hwid/d' drivers/misc/Kconfig || true
          sed -i '/plaid/d' drivers/misc/Kconfig || true

          # Создаем заглушки для папок и заголовочных файлов hwid
          mkdir -p drivers/misc/hwid drivers/misc/plaid
          touch drivers/misc/hwid/Makefile drivers/misc/hwid/Kconfig
          touch drivers/misc/plaid/Makefile drivers/misc/plaid/Kconfig
          touch drivers/misc/hwid.h
          touch include/linux/hwid.h

          # Автоматически создаем заглушки для любых других удаленных Kconfig
          for file in $(grep -roh 'source "[^"]*"' drivers/ | cut -d'"' -f2); do
            if [ ! -f "$file" ]; then
              mkdir -p "$(dirname "$file")"
              touch "$file"
            fi
          done

          # Устраняем дублирование функций в drivers/usb/gadget/udc/core.c
          python3 -c '
          with open("drivers/usb/gadget/udc/core.c", "r") as f:
              content = f.read()

          def fix_func(name, text):
              pattern = "static inline void " + name
              parts = text.split(pattern)
              if len(parts) > 2:
                  return pattern.join(parts[:2]) + "static inline void __attribute__((unused)) " + name + "_dup" + ("static inline void __attribute__((unused)) " + name + "_dup").join(parts[2:])
              return text

          content = fix_func("usb_gadget_enable_async_callbacks", content)
          content = fix_func("usb_gadget_disable_async_callbacks", content)

          with open("drivers/usb/gadget/udc/core.c", "w") as f:
              f.write(content)
          '

          # 1. Создаем базовый конфиг GKI
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig

          # 2. Накладываем конфиг garnet
          if [ -f arch/arm64/configs/vendor/garnet_GKI.config ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/garnet_GKI.config
          fi

          # 3. Включаем отладку DWARF и BTF
          scripts/config --file .config --enable CONFIG_DEBUG_INFO
          scripts/config --file .config --enable CONFIG_DEBUG_INFO_DWARF4
          scripts/config --file .config --enable CONFIG_DEBUG_INFO_BTF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Сборка базового vmlinux
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 vmlinux

      - name: Извлечение смещений
        run: |
          cd kernel
          echo "==================== [RT_MUTEX_WAITER] ===================="
          pahole -C rt_mutex_waiter vmlinux || true
          echo "==================== [TASK_STRUCT CRED] ===================="
          pahole -C task_struct vmlinux | grep -E "(cred|real_cred)" || true
          echo "==================== [CRED СТРУКТУРА] ===================="
          pahole -C cred vmlinux || true
